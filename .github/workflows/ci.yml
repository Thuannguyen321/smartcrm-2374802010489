# CI: moi lan push / pull request -> cai thu vien theo package-lock.json va chay `npm test`
# (unit + API + 12 test case he thong TC-01..TC-12 tren PostgreSQL 16 that).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token GITHUB_TOKEN cua moi job chi duoc DOC ma nguon (khong ghi repo, khong tao release).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcrm
          POSTGRES_PASSWORD: smartcrm_dev
          POSTGRES_DB: smartcrm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcrm -d smartcrm_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://smartcrm:smartcrm_dev@localhost:5432/smartcrm_db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # Khoa JWT ngau nhien cho moi lan chay CI (khong luu secret trong repo)
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test

  # BT3 - phep thu "may trang" tu dong: dung he thong bang dung 2 lenh cua Deployment Guide,
  # cho moi dich vu healthy, goi /health va chay npm test TRONG container.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose ps
      - run: curl -fsS http://localhost:3000/health
      - run: docker compose exec -T app npm test
      - if: failure()
        run: docker compose logs --tail 100

  # DevSecOps (buoi 17): kiem bao mat tu dong o moi lan push / pull request.
  # Action ghim theo commit SHA (khong dung tag) de tranh kieu tan cong tj-actions (CVE-2025-30066);
  # Dependabot (.github/dependabot.yml) mo PR khi co ban moi.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # lay ca lich su git de quet secret
      # (1) Quet secret: cau hinh mac dinh + danh sach gia tri MAU duoc phep trong .gitleaks.toml
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # (2) Lo hong thu vien: chi thu vien chay that (--omit=dev), chan tu muc high.
      #     Co y bo qua devDependencies (vite/esbuild chi dung cho dev server, khong co trong image)
      #     va muc moderate (react-router-dom 6.x) - xem docs/checklist-bao-mat.md muc 7.
      - name: npm audit (backend)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (client)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
