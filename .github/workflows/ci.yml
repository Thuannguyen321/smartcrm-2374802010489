# CI: moi lan push / pull request -> cai thu vien theo package-lock.json va chay `npm test`
# (unit + API + 12 test case he thong TC-01..TC-12 tren PostgreSQL 16 that).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcrm
          POSTGRES_PASSWORD: smartcrm_dev
          POSTGRES_DB: smartcrm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcrm -d smartcrm_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://smartcrm:smartcrm_dev@localhost:5432/smartcrm_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Khoa JWT ngau nhien cho moi lan chay CI (khong luu secret trong repo)
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
